<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сеть с нуля · Практикум Альт Linux</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#202d40;background:#f4f7fb;font-size:16px;line-height:1.65}*{box-sizing:border-box}body{margin:0}aside{position:fixed;width:288px;inset:0 auto 0 0;padding:30px 22px;background:#fff;border-right:1px solid #dde5ef;overflow:auto}.brand{font-size:23px;font-weight:800;color:#172d46;text-decoration:none;display:flex;align-items:center;gap:12px}.logo{background:#265eee;color:white;border-radius:12px;padding:0 11px;font-size:30px}.muted,nav h3{font-size:12px;letter-spacing:1.4px;color:#7a889a;margin-top:30px}.environment{background:#f1f5fb;padding:10px 14px;border-radius:8px;font-size:14px}.environment b{color:#8c9aaf;margin:0 8px}input{width:100%;padding:12px;border:1px solid #dce3ed;border-radius:9px;font:inherit;margin:22px 0 5px;font-size:14px}nav a{display:block;color:#58677b;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:7px;margin:3px 0}nav a.active{background:#eaf0ff;color:#255de7;font-weight:700}nav a:hover{background:#f1f5fa}main{margin-left:288px;padding:0 48px 70px;max-width:1450px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dde5ef;padding:24px 0;font-size:11px;letter-spacing:1px;color:#758297}button{font:inherit;background:white;color:#38506e;border:1px solid #d9e2ef;border-radius:8px;padding:9px 15px;cursor:pointer;font-size:14px}button:hover{border-color:#265eee;color:#265eee}.primary{background:#265eee;color:white;border:0;padding:13px 24px}.primary:hover{background:#174bd0;color:white}.eyebrow{color:#265eee;font-size:13px;font-weight:700;letter-spacing:1px;margin-top:40px}h1{font-size:clamp(32px,4.3vw,58px);line-height:1.12;letter-spacing:-2px;margin:18px 0 24px;max-width:780px}h2{font-size:25px;letter-spacing:-.5px}h3{font-size:19px}p{max-width:850px}.lead{color:#6a798e;font-size:19px;max-width:720px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;align-items:center;padding:20px 0 40px}.net{background:#e9f0ff;border:1px solid #cfddfa;border-radius:20px;padding:28px;text-align:center}.node{border:1px solid #c0d2f1;background:white;border-radius:10px;padding:12px;box-shadow:0 5px 12px #264b8420;font-weight:700}.node small{display:block;color:#758297;font-size:12px;font-weight:400}.branch{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:24px}.wire{height:26px;border-left:2px solid #8ba9e3;margin-left:50%}.tags{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.tag{background:#e8effc;color:#41618b;border-radius:6px;padding:4px 10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card,.panel{background:white;border:1px solid #e0e6ee;border-radius:14px;padding:24px;margin:20px 0}.card{margin:0}.card a{color:#255de7;text-decoration:none;font-weight:600}.card .symbol{font-size:26px;color:#265eee}.card p{color:#718096;font-size:14px}.notice{background:#fff5dd;border-left:3px solid #e5ad36;padding:16px 20px;border-radius:4px;margin:22px 0;font-size:15px}.tip{background:#eaf5f0;border-left:3px solid #3d9b75;padding:15px 20px;margin:20px 0}.step{border-left:2px solid #dee7f3;padding:0 0 20px 24px;margin:24px 0}.step h3{margin:0 0 8px}.step p{margin:8px 0}.codebox{position:relative;background:#142237;border-radius:10px;margin:14px 0;color:#e3ecfa;overflow:hidden}.codebox .label{background:#1e304a;padding:8px 16px;font-size:12px;color:#9fb6d6}.codebox button{position:absolute;right:9px;top:5px;background:#314663;color:white;border:0;padding:3px 10px;font-size:12px}pre{font:14px/1.65 ui-monospace,Consolas,monospace;margin:0;padding:20px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}code{background:#eaf0f8;padding:2px 5px;border-radius:4px;font-size:.9em}pre code{background:none;padding:0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:12px;border-bottom:1px solid #e3e9f2}th{color:#708097;font-size:12px}details{border:1px solid #e0e6ee;border-radius:10px;margin:14px 0;background:white;padding:14px 18px}summary{cursor:pointer;font-weight:600}.check{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:35px;padding-top:22px;border-top:1px solid #dae4f0}footer{font-size:13px;color:#758297;margin-top:30px}.track{height:5px;background:#e7edf7;border-radius:5px;margin:10px 0}.track i{display:block;height:100%;background:#265eee}.quiz button{margin:5px}a{color:#265eee}.repeat .explain{display:none}select{padding:10px;font:inherit;width:100%;border:1px solid #d9e2ef;border-radius:8px}.sourcehead{font-size:13px;color:#7889a1}.sourcehead p{margin:5px 0}@media(max-width:1000px){main{padding:0 25px 45px}.hero{grid-template-columns:1fr}.net{display:none}.grid{grid-template-columns:1fr}}@media(max-width:700px){aside{position:relative;width:auto;padding:20px}nav{max-height:220px;overflow:auto}nav h3{margin-top:15px}aside footer{display:none}main{margin:0;padding:0 20px 40px}header{gap:15px}header span{font-size:9px}h1{letter-spacing:-1px}.check{align-items:flex-start;flex-direction:column}}
</style><body><aside><a class="brand" href="#home"><span class="logo">⌘</span> Сеть с нуля</a><p class="muted">ТВОЙ УЧЕБНЫЙ СТЕНД</p><div class="environment">VirtualBox <b>+</b> Альт Linux</div><input id="search" placeholder="Найти урок или команду…" aria-label="Поиск уроков"><nav id="nav"></nav><footer><span id="progress"></span><div class="track"><i id="bar"></i></div><button id="reset">Сбросить прогресс</button></footer></aside><main><header><span>ПРАКТИКУМ / СИСТЕМНОЕ АДМИНИСТРИРОВАНИЕ</span><button id="exam">Режим повторения</button></header><div id="view"></div></main><script>const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let done;try{done=JSON.parse(localStorage.getItem('lab-done')||'[]')}catch{done=[]}let topics=[];const code=(s,l='Команды в терминале')=>`<div class="codebox"><div class="label">${esc(l)}</div><button class="copy">Копировать</button><pre>${esc(s)}</pre></div>`,step=(title,text,c='',expected='')=>`<section class="step"><h3>${title}</h3><p class="explain">${text}</p>${c?code(c):''}${expected?`<div class="tip"><b>Как понять, что получилось:</b> ${expected}</div>`:''}</section>`;
const lessons=[
['start','Перед первым запуском',()=>`<p class="lead">Сначала разберёмся, где ты находишься и что можно менять.</p>${step('Открой VirtualBox','На своём компьютере запусти Oracle VirtualBox. Слева находятся виртуальные машины — отдельные компьютеры внутри твоего компьютера. Если машины выданы преподавателем, используй их. Не создавай новые вместо экзаменационного стенда. Выдели машину и нажми «Запустить».')}${step('Попади в терминал','На сервере после загрузки обычно сразу появляется текстовый вход: введи логин, Enter, затем пароль и Enter. На рабочей станции открой меню приложений и найди «Терминал» или Konsole. При вводе пароля символы могут совсем не отображаться — это нормально. Правый Ctrl обычно освобождает мышь из окна VirtualBox.')}${step('Узнай, что за система','Введи по очереди. Команда cat показывает содержимое файла; здесь это сведения об ОС. Не вводи символы приглашения $ и #, если видишь их в примере.','cat /etc/os-release\nhostname\nip -br link\nip -br addr\nip route','Запиши версию ALT, имя машины и названия интерфейсов. enp0s3 и enp0s8 — примеры, а не обязательные имена.')}${step('Получи права администратора','Введи su с дефисом и пароль root, выданный для стенда. Это пароль администратора Linux, а не обязательно пароль твоей обычной учётной записи.','su -','Выполни id: uid=0 означает root. Если su запрещён, используй предусмотренный преподавателем способ sudo.')}${step('Научись сохранять файл','В примерах используется nano. Стрелки перемещают курсор. Ctrl+O сохраняет, Enter подтверждает имя файла, Ctrl+X закрывает редактор. Ctrl+C останавливает ping. В терминале Ctrl+C не копирует выделенный текст: обычно копирование — Ctrl+Shift+C, вставка — Ctrl+Shift+V. В консоли VirtualBox вставка может быть недоступна.')}${step('Проверь средства управления сетью','Не переключай сетевую подсистему наугад. В следующих уроках используется etcnet. Если интерфейс обслуживает NetworkManager, сначала настрой способ управления через Центр управления системой → Ethernet-интерфейсы либо согласуй его с преподавателем.','systemctl is-active network\nsystemctl is-active NetworkManager\nls /etc/net/ifaces','Для etcnet у нужного интерфейса в options должны быть DISABLED=no, NM_CONTROLLED=no, SYSTEMD_CONTROLLED=no. Активная служба сама по себе не доказывает, кто управляет конкретным портом.')}<div class="notice">Стенд здесь недоступен: команды не запускались на твоих виртуальных машинах. Неизвестны точная версия ALT и настройки выданных образов. Сайт показывает учебный порядок и отдельно помечает исходные примеры, требующие переноса.</div>`],
['wires','Как соединить машины',()=>`<p class="lead">Виртуальный адаптер — разъём, внутренняя сеть VirtualBox — виртуальный кабельный сегмент.</p>${step('Сначала посмотри готовые подключения','Выключи учебную машину штатно через меню ОС. В VirtualBox выбери её → «Настроить» → «Сеть». На экзамене сначала сверяй готовую топологию; не переподключай выданные адаптеры без необходимости.')}${step('Для самостоятельной тренировки назначь сегменты','На вкладке «Адаптер 1» включи адаптер, выбери тип подключения и имя сети из таблицы. Нажми «Дополнительно» и проверь «Кабель подключён». Одинаковые имена внутренних сетей означают общий сегмент. Обычный NAT нужен только внешнему порту ISP.')}${table(['Машина','Адаптер','Подключение / имя'],[['ISP','1 / 2 / 3','NAT / isp-hq / isp-br'],['HQ-RTR','1 / 2','isp-hq / hq-trunk'],['BR-RTR','1 / 2','isp-br / br-transit'],['BR-FW','1 / 2','br-transit / br-lan'],['BR-SRV','1','br-lan'],['HQ-SRV','1','hq-trunk (VLAN 100 внутри Linux)'],['HQ-CLI','1','hq-trunk (VLAN 200 внутри Linux)']])}<div class="notice">Это предлагаемый учебный стенд для VirtualBox. В исходнике используется VLAN Tag на Proxmox. В VirtualBox такого поля у адаптера нет: для этого учебного решения метку добавляют сами HQ-SRV и HQ-CLI. Если требуется именно нетегированный порт клиента, нужен отдельный виртуальный коммутатор с access/trunk-портами.</div>${step('Сопоставь разъём и имя Linux','В настройках VirtualBox посмотри MAC-адрес каждого адаптера. В Linux ip -br link показывает тот же адрес с двоеточиями. Так ты узнаешь, какой enp0s… смотрит в нужную сеть. Не считай номер в имени номером адаптера.','ip -br link','Составь свою таблицу: машина → адаптер VirtualBox → имя Linux → сосед.')}<p>Клиенту и серверу HQ не добавляй дополнительный NAT ради интернета: он обойдёт учебные маршрутизаторы и скроет ошибку.</p>`],
['map','Кто за что отвечает',()=>`<p class="lead">HQ — главный офис, BR — филиал. RTR — маршрутизатор, SRV — сервер, CLI — рабочее место, FW — межсетевой экран.</p>${table(['Устройство','Роль','Адреса по файлу'],[['ISP','Связь с внешней сетью','Внешний DHCP; 172.16.1.1/28; 172.16.2.1/28'],['HQ-RTR','Шлюз офиса HQ','172.16.1.2/28; 192.168.100.1/27; 192.168.20.1/28; 192.168.99.1/29'],['BR-RTR','Шлюз филиала','172.16.2.2/28; 192.168.30.1/30'],['BR-FW','Промежуточный узел филиала','192.168.30.2/30; 192.168.200.1/28'],['HQ-SRV','Сервер HQ','192.168.100.2/27, шлюз 192.168.100.1'],['BR-SRV','Сервер филиала, контроллер домена','192.168.200.2/28, шлюз 192.168.200.1'],['HQ-CLI','Клиент','DHCP 192.168.20.2–14/28, шлюз 192.168.20.1']])}<div class="panel explain"><h3>Как читать /28</h3><p>В сети /28 всего 16 адресов: один обозначает сеть, один — широковещательную рассылку, 14 остаются устройствам. В 192.168.20.0/28 устройства используют .1–.14, адрес .15 — broadcast. /27 даёт 30 адресов устройствам, /29 — 6, /30 — 2.</p><p>Пакет HQ-CLI → BR-SRV идёт через HQ-RTR → GRE → BR-RTR → BR-FW. Обратный маршрут тоже обязан существовать.</p></div><div class="quiz"><h3>Проверь себя</h3><p>Какой шлюз должен получить HQ-CLI?</p><button data-answer="Нет. Это DNS и сервер в другой подсети.">192.168.100.2</button><button data-answer="Верно. Шлюз находится в той же подсети, что клиент.">192.168.20.1</button><button data-answer="Нет. Это адрес самой сети.">192.168.20.0</button><p id="answer"></p></div>`],
['ip','Настроить адрес в Альт Linux',()=>`<p class="lead">Один подробный пример: HQ-SRV на etcnet. Сначала выполни урок про VLAN — в нашей схеме сервер использует тегированный интерфейс.</p>${step('Дай машине имя','Выполни только на HQ-SRV. На других машинах подставляй их собственное имя. hostnamectl не настраивает DNS: это отдельная задача.','hostnamectl set-hostname hq-srv.au-team.irpo\nhostname','Должно появиться hq-srv.au-team.irpo.')}${step('Выбери правильный интерфейс','В нашем учебном VirtualBox HQ-SRV подключён к hq-trunk, поэтому его адрес будет на VLAN 100. Ниже enp0s3.100 — пример: замени enp0s3 на своё имя. Если стенд уже выдаёт нетегированный VLAN 100 через коммутатор, адрес ставится на обычный интерфейс.')}${step('Открой настройки адреса','После создания VLAN в следующем уроке открой файл. В редакторе должна остаться одна строка с адресом.','nano /etc/net/ifaces/enp0s3.100/ipv4address','Содержимое файла: 192.168.100.2/27. Сохрани Ctrl+O, Enter, Ctrl+X.')}${code('192.168.100.2/27','Содержимое ipv4address — НЕ команда')}${step('Укажи шлюз','Открой другой файл. default означает маршрут для адресов, для которых нет более точного пути.','nano /etc/net/ifaces/enp0s3.100/ipv4route')}${code('default via 192.168.100.1','Содержимое ipv4route — НЕ команда')}${step('Примени из консоли VirtualBox','Перезапуск может прервать SSH, поэтому первую настройку делай прямо в окне виртуальной машины.','systemctl restart network\nip -br addr\nip route\nping -c 3 192.168.100.1','Адрес назначен, есть default via 192.168.100.1. Ping заработает после настройки HQ-RTR и VLAN.')}${step('Повтори принцип на остальных портах','Для обычного Ethernet создай каталог /etc/net/ifaces/ИМЯ. В options впиши строки ниже, в ipv4address — адрес из таблицы, в ipv4route — шлюз, если он нужен. На внутреннем порту маршрутизатора шлюз по умолчанию не добавляется.')}${code('TYPE=eth\nBOOTPROTO=static\nONBOOT=yes\nCONFIG_IPV4=yes\nDISABLED=no\nNM_CONTROLLED=no\nSYSTEMD_CONTROLLED=no','Содержимое options обычного Ethernet')}${step('Внешний порт ISP','Только внешний порт ISP получает адрес по DHCP. В его options используй BOOTPROTO=dhcp вместо static, адрес и default route получаются автоматически. Не переноси DHCP на внутренние порты ISP.')}<div class="notice">Не создавай /etc/network/interfaces по исходнику: урок использует etcnet в ALT. Перед редактированием сохрани копии имеющихся файлов командой cp файл файл.bak.</div>`],
['vlan','VLAN в VirtualBox и ALT',()=>`<p class="lead">В этом учебном подключении HQ-RTR, HQ-SRV и HQ-CLI находятся в hq-trunk и сами добавляют VLAN-метки.</p>${step('Подготовь физический порт','Для примера физический порт называется enp0s3. На HQ-RTR используй порт в сторону hq-trunk, а не ISP. Его options должны задавать etcnet и TYPE=eth. Не назначай физическому порту IP из клиентской или серверной сети. Сначала перенеси существующие адреса и default route на нужный VLAN, если они были.')}${step('Создай каталог VLAN 100','На HQ-RTR, а затем на HQ-SRV. mkdir создаёт папку, -p позволяет создать недостающие родительские папки.','mkdir -p /etc/net/ifaces/enp0s3.100\nnano /etc/net/ifaces/enp0s3.100/options')}${code('TYPE=vlan\nHOST=enp0s3\nVID=100\nBOOTPROTO=static\nCONFIG_IPV4=yes\nONBOOT=yes\nDISABLED=no\nNM_CONTROLLED=no\nSYSTEMD_CONTROLLED=no','Содержимое options VLAN 100')}${step('Назначь адреса','На HQ-RTR в ipv4address этого VLAN запиши 192.168.100.1/27. На HQ-SRV — 192.168.100.2/27. На HQ-SRV добавь ipv4route: default via 192.168.100.1. Не назначай одинаковый IP двум машинам.')}${step('Создай VLAN 200 и 999','На HQ-RTR повтори с каталогом enp0s3.200, VID=200 и адресом 192.168.20.1/28; затем .999, VID=999 и 192.168.99.1/29. На HQ-CLI создай только VLAN 200: те же options с VID=200, но BOOTPROTO=dhcp. Не задавай клиенту static, если задание требует DHCP.')}${step('Проверь метки','На каждой машине примени конфигурацию.','systemctl restart network\nip -d link show\nip -br addr','В подробном выводе у VLAN 100 должно быть vlan id 100; HOST соответствует физическому порту. До запуска DHCP у клиента может не быть IPv4.')}`],
['debug','Если что-то не работает',()=>`<p class="lead">Проверяй от ближайшего к дальнему. Одна проверка отвечает на один вопрос.</p>${table(['Симптом','Что проверить','Что это значит'],[['Нет интерфейса','ip -br link; настройки VirtualBox','Адаптер выключен либо имеет другое имя'],['NO-CARRIER','Кабель подключён; имя внутренней сети','Нет виртуального соединения'],['Нет IP','ip -br addr; options; журнал network','Конфигурация не применена или другой менеджер сети'],['Не отвечает шлюз','Маска, VLAN, IP соседа','Ошибка внутри ближайшего сегмента'],['Шлюз отвечает, филиал нет','ip route; GRE; OSPF; forwarding','Не найден путь между сетями'],['IP работает, имя нет','cat /etc/resolv.conf; dig @DNS имя','Проблема DNS'],['Connection refused','ss -lntup; systemctl status службы','Узел доступен, но порт не принимает соединение'],['Timeout','Маршруты в обе стороны, firewall','Ответ не пришёл; это не всегда неправильный пароль'],['Permission denied','Логин, пароль, AllowUsers, права','Сеть уже работает, отказала авторизация']])}${code('systemctl --failed\nsystemctl status network --no-pager\njournalctl -u network -n 40 --no-pager\nip route\nss -lntup','Диагностика: команды не меняют настройки')}<p class="explain">Выход из просмотра systemctl status — клавиша Q. Сохрани текст ошибки полностью. Не переустанавливай пакеты и не очищай firewall до понимания причины.</p>`],
['practice','Как готовиться к экзамену',()=>`<p class="lead">Цель — собрать работающий стенд и суметь найти ошибку без подсказки.</p>${step('Первый проход: с объяснениями','Выполняй по одному шагу. Перед Enter проговаривай название машины, назначение команды и ожидаемый результат. Отмечай урок завершённым только после проверки.')}${step('Второй проход: по краткому плану','Включи «Режим повторения» вверху. Он скроет длинные объяснения в подготовительных уроках. Подсматривай, когда застрял, затем повтори этот шаг самостоятельно.')}${step('Третий проход: с чистого состояния','Дома используй снимки VirtualBox: выдели выключенную машину → «Снимки» → «Сделать». Для повторения возвращайся к своему начальному снимку. Откат удаляет изменения после снимка: не откатывай выполненную экзаменационную работу.')}${step('Сохраняй доказательства','После настройки сфотографируй или сними скриншот команды и результата. Снимок должен показывать имя машины и читабельный вывод. В исходнике требуется итоговый отчёт ФамилияУчастникаЗадание1 и документы с индексом пункта; сверяй требования с выданным экзаменационным листом.')}${step('Проверяй после перезагрузки','Работающая команда ip сама по себе не гарантирует сохранение настройки. Перезагрузи учебную машину и повтори проверки IP, маршрутов, служб и доступа клиента. Запиши, какие настройки исчезли.')}`]
];
function table(h,r){return `<div style="overflow:auto"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const notes={0:'hostnamectl подходит и для ALT. Обновление приглашения терминала не является проверкой DNS.',1:'Для ALT используй /etc/net/ifaces, как в подготовительном уроке. Не копируй /etc/network/interfaces. Имена ens18/ens19 замени после сопоставления MAC.',2:'В ALT перезапускается network. Внешний интерфейс ISP получает DHCP, остальные статические. Проверяй имя внешнего порта в NAT.',3:'Инструкции с vmbr4 и VLAN Tag относятся к Proxmox. Для VirtualBox следуй нашему уроку VLAN.',4:'В ALT GRE можно сохранять через etcnet: TYPE=iptun, TUNTYPE=gre, TUNLOCAL и TUNREMOTE, TUNTTL=255, HOST — внешний порт. Адрес туннеля хранится в ipv4address. pre-up из /etc/network/interfaces не переносится.',5:'nftables и net.ipv4.ip_forward применимы в ALT. flush ruleset удаляет ВСЕ существующие правила: объединяй правила NAT, DNAT и защиты в одном конфиге. Сначала nft -c -f файл, потом применение. Сверь путь конфигурации через systemctl cat nftables.',6:'Нужен FRR и включённый ospfd. Для GRE задай одинаковый тип OSPF point-to-point на двух концах, если соседство застревает. Имя ens19 замени на своё. Ожидаемый результат — Full и маршруты в обе стороны.',7:'В ALT установку делай через apt-get. sudoers редактируй visudo. Убедись, что UID 2027 свободен: getent passwd 2027. Не создавай дубликаты пользователей.',8:'В ALT пакет openssh-server, служба обычно sshd, а не ssh. Сначала sshd -t, потом systemctl restart sshd. Не добавляй конфликтующие Port и AllowUsers в конец наугад; проверь Include и Match.',9:'В ALT пакет dhcp-server, служба dhcpd. Конфиг /etc/dhcp/dhcpd.conf. /etc/default/isc-dhcp-server — путь Debian; в ALT смотри systemctl cat dhcpd и /etc/sysconfig/dhcpd. На клиенте DHCP включается на VLAN 200 в нашей схеме.',10:'Проверь, загружается ли /etc/dnsmasq.d через conf-dir в основном конфиге. Для домена AD добавь условную пересылку зоны и обратной зоны на BR-SRV: local=/au-team.irpo/ без SRV-записей контроллера помешает вступлению в домен. Статическая A-запись клиента .2 верна только при резервировании DHCP. В исходнике web и docker указывают на разные внутренние адреса ISP: проверь их достижимость и привязку nginx.',11:'Используй timedatectl list-timezones, выбери пояс из своего экзаменационного задания. Отдельно проверь NTP.',12:'До ввода клиента проверь dig SRV _ldap._tcp.au-team.irpo у DNS домена и часы. Samba DC по исходнику уже установлен. Не запускай provision поверх готового домена. Не удаляй alterator-datetime автоматически: это обход частной проблемы автора, а не обязательный шаг.',13:'Команды mdadm, mkfs и parted могут уничтожить данные. Сначала lsblk -f и сопоставление дисков VirtualBox. /dev/sdb и /dev/sdc — лишь примеры. Для fstab предпочитай UUID; mdadm.conf и initramfs проверь по своей версии ALT.',14:'В ALT названия пакетов и служб NFS отличаются от Debian. Проверь apt-cache search nfs и systemctl list-unit-files. Каталог /raid должен быть смонтирован до экспорта. Проверяй UID/GID; не устраняй проблемы прав через chmod 777.',15:'В ALT конфиг обычно /etc/chrony.conf, служба chronyd. Уточни через rpm -ql chrony и systemctl cat chronyd. Проверка chronyc sources -v и chronyc tracking. Один лишь правильный часовой пояс не синхронизирует часы.',16:'Inventory — список машин и SSH-параметров. Для серверов используй порт 2027 и sshuser. Ansible ping проверяет SSH и Python. SSH-ключи копируй после проверки обычного входа.',17:'В ALT пакет docker-engine; compose может поставляться отдельно. Сверяй apt-cache search docker и docker compose version. Не применяй отключение AppArmor из исходника без совпадающей ошибки. Файлы образов и compose нужны с твоего Additional.iso.',18:'Для ALT не предполагается структура /etc/apache2/sites-available из Debian. Уточни пакеты apache2, PHP и MariaDB через apt-cache; пути — rpm -ql, unit — systemctl list-unit-files. После установки выполняй SQL и размещай файлы согласно путям установленного Apache.',19:'Добавь DNAT к имеющемуся nftables-конфигу, сохрани исходящий masquerade. Проверь обратный маршрут сервера. Правила должны совпадать с реальными интерфейсами, адресами и портами.',20:'Устанавливай пакет для ALT и своей архитектуры. Запуск браузера выполняется от обычного пользователя рабочего стола, не root.',21:'Не запускай скачанный import.sh вслепую: сначала прочитай его и сравни заголовки CSV. Должны сохраняться пароли и атрибуты задания, а не случайно выбранный набор столбцов.',22:'В ALT утилита htpasswd может находиться в другом пакете: apt-cache search htpasswd. Сверь существующий nginx.conf и подключение conf.d. Перед reload — nginx -t.',23:'Проверь DNS-имена в SAN сертификата. Доверие к корневому сертификату нужно настроить и в системе, и при необходимости в браузере. Закрытый ключ CA не передаётся на ISP.',24:'Установка apt-get install atop. Путь журнала и период записи сверяй по unit и конфигу пакета. Проверка — открыть сохранённый журнал, а не только текущую нагрузку.',25:'Пакеты и фильтры печати зависят от ALT. Веб-интерфейс CUPS: localhost:631. Разрешай сеть клиента явно; не открывай управление для всех без условия задания.',26:'Выгрузка setup должна содержать настоящие факты HQ-SRV и HQ-CLI. Сначала проверь Ansible ping на обоих узлах.',27:'Проверь фактический backend журналирования SSH в ALT. Для systemd используй подходящий backend и порт 2027. После настройки fail2ban-client status sshd. Не блокируй себя при единственном SSH-сеансе.',28:'Не копируй приватные ключи в общедоступное место. Перед заданием по расписанию выполни одну копию вручную, затем tar -tf и пробное извлечение в отдельную папку. Не распаковывай архив поверх /etc для проверки.'};
function home(){return `<section class="hero"><div><div class="eyebrow">ОТ ПЕРВОГО ЗАПУСКА ДО ПРОВЕРКИ</div><h1>Разберись в сети.<br>Собери её сам.</h1><p class="lead">Подготовка к практическому экзамену: понятные шаги, команды и объяснение того, что происходит на каждой машине.</p><button class="primary" onclick="location.hash='start'">Начать с самого начала</button><div class="tags"><span class="tag">VirtualBox</span><span class="tag">Альт Linux</span><span class="tag">3 модуля исходника</span></div></div><div class="net"><div class="node">Интернет<small>внешняя сеть</small></div><div class="wire"></div><div class="node">ISP<small>выход учебного стенда</small></div><div class="branch"><div class="node">Офис HQ<small>HQ-RTR · сервер · клиент</small></div><div class="node">Филиал BR<small>BR-RTR · BR-FW · сервер</small></div></div><p style="font-size:13px;color:#6480ac">Между офисами — GRE и OSPF</p></div></section><div class="grid"><div class="card"><span class="symbol">01</span><h3>Понять основу</h3><p>Что такое виртуальная машина, IP, шлюз и VLAN. Где открыть терминал и как сохранить файл.</p><a href="#start">Подготовить стенд</a></div><div class="card"><span class="symbol">02</span><h3>Пройти задания</h3><p>Все темы из файла: смысл, порядок работы, исходные команды и замечания по переносу в ALT.</p><a href="#t0">Открыть первый модуль</a></div><div class="card"><span class="symbol">03</span><h3>Проверить результат</h3><p>Проверки после каждого этапа и порядок поиска ошибок, когда что-то не заработало.</p><a href="#debug">Разобраться с ошибкой</a></div></div><div class="notice"><b>Важное отличие от исходника.</b> Файл смешивает команды Debian, настройки Proxmox и отдельные шаги ALT. Подготовительные уроки написаны для VirtualBox + etcnet. В разделах заданий исходные команды помечены как справочные: перенос зависит от версии ALT и образов стенда.</div><div class="panel"><h2>Как пользоваться практикумом</h2><p>Открой урок рядом с VirtualBox. Сначала прочитай, на какой машине работать. Выполняй по одному действию, проверяй результат и только потом отмечай завершение. Отметки сохраняются в этом браузере.</p><a href="https://github.com/shiraorie/demo-2027/blob/main/1var.md" target="_blank" rel="noopener">Открыть исходный файл задания</a> · <a href="#sources">Документация и границы проверки</a></div>`}
function topic(i){let t=topics[i];return `<div class="eyebrow">МОДУЛЬ ${t.module} / ПРАКТИЧЕСКАЯ РАБОТА</div><h1>${t.title}</h1><p class="lead">${t.why}</p><div class="notice"><b>Перенос в Альт Linux.</b> ${notes[i]||''}</div><div class="panel explain"><h3>Порядок работы</h3><ol><li>Прочитай пункт экзаменационного листа: имена, адреса и пароли могут отличаться от репозитория.</li><li>Открой консоль указанной машины в VirtualBox. Проверь hostname, ip -br addr и права через id.</li><li>Проверь зависимости: адреса → шлюзы → маршруты → DNS и время → служба.</li><li>Сохрани копию изменяемого конфига. Открывай файл через nano, сохраняй Ctrl+O, Enter, Ctrl+X.</li><li>Выполни нужные действия по одному. Блок «содержимое файла» вводится в редактор, остальные команды — в соответствующую консоль.</li><li>Проверь синтаксис, запусти службу, проверь её с клиента. Сохрани результат для отчёта.</li></ol></div><h2>Разбор исходных примеров</h2><p>Это команды из присланного файла, а не проверенный скрипт установки на ALT. Не вставляй весь раздел разом. Сверяй замечание выше и название машины в <a href="https://github.com/shiraorie/demo-2027/blob/main/1var.md#L${t.line}" target="_blank" rel="noopener">полном контексте оригинала</a>.</p>${t.blocks.map((b,k)=>`<details ${k===0?'open':''}><summary>Блок ${k+1} · ${esc(b.code.split('\n')[0].slice(0,80))}</summary><p class="sourcehead">${kind(b.code)}</p>${code(b.code,'ИЗ ИСХОДНИКА · сверить совместимость с ALT')}<p class="explain">${explain(b.code)}</p></details>`).join('')}<div class="panel"><h3>Финишная проверка</h3><p>${verify(i)}</p><p>После успешной проверки повтори её с другой машины и после перезагрузки учебного узла. Если не получилось, открой <a href="#debug">порядок диагностики</a>.</p></div>`}
function kind(s){if(/^(configure terminal|router ospf)/.test(s))return 'Вводится в консоли FRR (vtysh), а не в Bash.';if(/^(\[|Port |TYPE=|auto |iface |domain=|authoritative|subnet |server |server\{|server\s*\{|services:|#!)/.test(s)||/hook |listen-address|<VirtualHost/.test(s))return 'Похоже на содержимое конфигурационного файла. Сверь путь в оригинале; это не набор команд Bash.';if(/^(CREATE |GRANT |FLUSH |USE |SHOW |SELECT )/i.test(s))return 'SQL: вводится в клиенте базы данных.';return 'Пример из исходника: контекст может быть командой, содержимым файла или ожидаемым выводом. Перед вводом сверь оригинал.'}
function explain(s){const pairs=[['apt','Установка: в ALT используй apt-get update и apt-get install, предварительно проверь имя пакета через apt-cache search.'],['systemctl','systemctl управляет службами: enable включает автозапуск, start запускает сейчас, restart перезапускает, status показывает состояние.'],['nano','nano открывает файл для редактирования. Само открытие ещё ничего не меняет.'],['mkdir','mkdir создаёт каталог. Ключ -p создаёт и недостающие родительские каталоги.'],['chmod','chmod меняет права доступа. +x разрешает запуск файла.'],['chown','chown меняет владельца файла или каталога.'],['mount','mount подключает файловую систему в каталог. Перед этим проверь устройство через lsblk.'],['ssh','SSH выполняет вход на удалённую машину. -p задаёт порт; у scp для порта используется заглавная -P.'],['nft','nft управляет правилами фильтрации и NAT. -c проверяет без применения, -f загружает файл.'],['samba-tool','samba-tool управляет объектами домена Samba. user — пользователи, group — группы.'],['openssl','openssl работает с ключами, запросами и сертификатами. Проверяй имена файлов и SAN.'],['mdadm','mdadm управляет RAID. --create создаёт массив и требует верного выбора пустых дисков.'],['mkfs','mkfs создаёт файловую систему и уничтожает прежнее содержимое выбранного раздела.'],['ip route','ip route показывает или изменяет маршруты. default — маршрут для всех остальных направлений.'],['ping','ping проверяет обмен ICMP. Успешный ответ по IP не доказывает работу DNS или веб-сервера.'],['write memory','write memory сохраняет настройки FRR. Без сохранения они могут пропасть при перезапуске.']];return pairs.filter(([a])=>s.includes(a)).map(([,b])=>b).join(' ')||'Проверь, что имена узлов, адреса и пути относятся именно к твоей машине. Различай команду, конфигурацию и ожидаемый вывод. Не вводи строки результата проверки как команды.'}
function verify(i){return ['hostname показывает полное имя; DNS проверяется отдельно.','ip -br addr показывает адрес, ip route — шлюз; ping ближайшего соседа.','На ISP есть внешний адрес и default route; с маршрутизаторов доступен внешний IP.','ip -d link показывает VID; HQ-SRV пингует 192.168.100.1.','На HQ-RTR ping -c 3 10.10.10.2; ip -d tunnel show показывает верные концы.','sysctl net.ipv4.ip_forward выдаёт 1; nft list ruleset содержит нужные правила; клиент выходит по IP.','vtysh -c "show ip ospf neighbor" показывает Full; show ip route ospf содержит сети другого офиса.','id sshuser на серверах показывает UID 2027; sudo -l показывает требуемые права.','sshd -t без ошибок; ss -lntp показывает 2027; с HQ-CLI входит sshuser.','HQ-CLI получил адрес .2–.14, шлюз .1, DNS 192.168.100.2.','dig @192.168.100.2 hq-srv.au-team.irpo и dig -x 192.168.200.2 возвращают нужные записи.','timedatectl показывает требуемый часовой пояс.','system-auth status подтверждает домен; id доменного пользователя работает на HQ-CLI.','cat /proc/mdstat показывает RAID0; findmnt /raid подтверждает монтирование, в том числе после reboot.','На HQ-CLI findmnt показывает NFS; файл, созданный клиентом, виден на сервере.','chronyc sources -v показывает выбранный источник (*), chronyc tracking — синхронизацию.','ansible all -m ping возвращает SUCCESS и pong для каждого узла.','docker compose ps показывает работающие сервисы, приложение открывается с клиента на 8080.','Страница отображается в браузере и получает реальные данные из webdb.','Проверь веб и SSH через внешние адреса и порты маршрутизаторов с ISP.','Браузер запускается от обычного пользователя и открывает учебные сайты.','samba-tool user list и просмотр атрибутов подтверждают импорт; проверь вход импортированной учётной записью.','nginx -t успешен; оба имени открывают свои приложения; WEB проходит web-аутентификацию.','Сертификат соответствует имени, цепочка доверена клиентом, браузер открывает HTTPS без ошибки доверия.','atop показывает процессы и открывает сохранённую историю.','CUPS видит принтер и очередь; клиент может отправить тестовое задание.','Отчёты содержат сведения обоих узлов, соответствующие hostname и ОС.','fail2ban-client status sshd показывает активную jail, порт 2027 и настроенные пороги.','Архив находится на HQ-CLI, tar -tf показывает etc; пробное извлечение в отдельную папку работает.'][i]}
function sources(){return `<h1>Источники и проверка</h1><div class="panel"><p>Основа тем — файл <a href="https://github.com/shiraorie/demo-2027/blob/main/1var.md">1var.md, shiraorie/demo-2027</a>, прочитан 23 ноября 2026. Разделы сохраняют исходные примеры команд для сопоставления с учебным листом.</p><p>Это учебная версия сайта: подготовка VirtualBox и основы etcnet расписаны отдельно. Подробные разделы трёх модулей содержат замечания о переносе, но ещё не являются полностью проверенной инструкцией для конкретного образа ALT. Твои виртуальные машины не были доступны для проверки.</p><ul><li><a href="https://docs.altlinux.org/ru-RU/alt-server/11.1/html/alt-server/etcnet-vlan.html">ALT Server: VLAN и etcnet</a></li><li><a href="https://docs.altlinux.org/ru-RU/alt-server/11.1/pdf/alt-server/alt-server-11.1-alt-server-ru-RU.pdf">Руководство администратора ALT Server</a></li><li><a href="https://www.basealt.ru/knowledge_base/ALT_Domain_install.html">Базальт СПО: доменная инфраструктура</a></li><li><a href="https://docs.altlinux.org/ru-RU/alt-orchestra/11.0/html-single/alt-orchestra/index.html">ALT: пример DHCP-сервера</a></li><li><a href="https://docs.frrouting.org/en/latest/ospfd.html">FRR: OSPF</a></li></ul><p>Готовность урока в прогрессе — твоя отметка о прохождении, а не автоматическая проверка виртуальной машины.</p></div>`}

600\" />\n\n\nBR-RTR\n\n```bash\nhostnamectl set-hostname br-rtr.au-team.irpo; exec bash\n```\n\n\n  \n\n\nHQ-SRV"}, {"code": "hostnamectl set-hostname br-srv.au-team.irpo; exec bash", "context": "r-rtr.png\" width=\"600\" />\n\n\nHQ-SRV\n\n```bash\nhostnamectl set-hostname hq-srv.au-team.irpo; exec bash\n```\n\n\n  \n\n\nBR-SRV"}, {"code": "su -", "context": "\">BR-SRV\n\n```bash\nhostnamectl set-hostname br-srv.au-team.irpo; exec bash\n```\n\n\n  \n\n\nHQ-CLI\n\nНа клиентской машине сначала переходим в root:"}, {"code": "hostnamectl set-hostname hq-cli.au-team.irpo; exec bash", "context": "br-srv.au-team.irpo; exec bash\n```\n\n\n  \n\n\nHQ-CLI\n\nНа клиентской машине сначала переходим в root:\n\n```bash\nsu -\n```\n\nПосле этого меняем имя устройства:"}, {"code": "hostnamectl set-hostname br-fw.au-team.irpo; exec bash", "context": "еходим в root:\n\n```bash\nsu -\n```\n\nПосле этого меняем имя устройства:\n\n```bash\nhostnamectl set-hostname hq-cli.au-team.irpo; exec bash\n```\n\n\n  \n\n\nBR-FW"}]}, {"title": "IP-адреса", "why": "IP — адрес компьютера в сети. Маска определяет его соседей, шлюз помогает добраться до остальных.", "module": 1, "line": 171, "blocks": [{"code": "nano /etc/network/interfaces", "context": "страиваем только интерфейс в сторону ISP.\n\nИнтерфейс в сторону HQ оставляем без адресации, так как VLAN 100, 200 и 999 будут настроены позднее в отдельном пункте задания.\n\nОткрываем конфигурацию сети:"}, {"code": "auto ens18\niface ens18 inet static\n    address 172.16.1.2/28\n    gateway 172.16.1.1\n\nauto ens19\niface ens19 inet manual", "context": "торону HQ оставляем без адресации, так как VLAN 100, 200 и 999 будут настроены позднее в отдельном пункте задания.\n\nОткрываем конфигурацию сети:\n\n```bash\nnano /etc/network/interfaces\n```\n\nНастраиваем:"}, {"code": "systemctl restart networking", "context": "ork/interfaces\n```\n\nНастраиваем:\n\n```text\nauto ens18\niface ens18 inet static\n    address 172.16.1.2/28\n    gateway 172.16.1.1\n\
